{% extends "ui/panels/_base.html" %}
{% load i18n %}

{% block panel_content %}
  <table class="table table-hover mb-0">
    <thead>
      <tr>
        <th scope="col">{% trans "Protocol" %}</th>
        <th scope="col">{% trans "Destination port" %}</th>
      </tr>
    </thead>
    <tbody>
      {% for service in services %}
        <tr>
          <td>{{ service.protocol_display }}</td>
          <td><a href="{{ service.get_absolute_url }}">{{ service.port_display }}</a></td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2" class="text-secondary">{% trans "None" %}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
