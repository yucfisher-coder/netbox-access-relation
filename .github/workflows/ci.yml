name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate that every Compose file parses and interpolates cleanly.
  validate:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate env files from examples
        run: |
          cp .env.example .env
          cp .env.production.example .env.production

      - name: Validate dev compose (root)
        run: docker compose --env-file .env -f docker-compose.yml config --quiet

      - name: Validate dev compose (compose/)
        run: docker compose --env-file .env -f compose/dev.yml config --quiet

      - name: Validate production compose (root)
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Validate production compose (compose/)
        run: docker compose --env-file .env.production -f compose/production.yml config --quiet

  # Build the distributable plugin wheel and assert its packaged contents.
  wheel:
    name: Plugin wheel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: plugins/netbox_access_relations
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify packaged contents
        working-directory: plugins/netbox_access_relations
        run: |
          whl=$(ls dist/*.whl | head -n1)
          echo "Built: $whl"
          unzip -l "$whl" | grep -q 'netbox-plugin.yaml' || { echo 'netbox-plugin.yaml missing from wheel'; exit 1; }
          unzip -l "$whl" | grep -q 'templates/.*\.html' || { echo 'templates missing from wheel'; exit 1; }
          echo "Wheel contents OK."

  # Build the dev image to verify the Dockerfile and pinned base image pull.
  image-build:
    name: Dev image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate env file from example
        run: cp .env.example .env

      - name: Build dev image
        run: docker compose --env-file .env -f docker-compose.yml build netbox
